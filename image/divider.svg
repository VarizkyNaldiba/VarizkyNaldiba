<svg width="400" height="10" viewBox="0 0 400 10" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing Gradient for the Divider -->
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Central Glowing Horizontal Rule -->
  <line x1="0" y1="5" x2="400" y2="5" stroke="url(#div-grad)" stroke-width="1.5" />
  
  <!-- Center tech accent diamond -->
  <path d="M 197 5 L 200 2 L 203 5 L 200 8 Z" fill="#3b82f6" />
</svg>
