<svg width="100%" height="120" viewBox="0 0 800 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0b0f1a" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@600;700;800&amp;display=swap');
    .font-title { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .font-desc { font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; fill: #9ca3af; }
    .font-badge { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #60a5fa; letter-spacing: 0.5px; }
    .font-btn { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .card-border { stroke: #1e293b; stroke-opacity: 0.8; }
    .card-border-glow { stroke: #3b82f6; stroke-opacity: 0.3; }
  </style>

  <!-- Card Background -->
  <rect width="800" height="120" rx="10" fill="url(#card-grad)" />
  <rect x="0.5" y="0.5" width="799" height="119" rx="9.5" class="card-border" />
  
  <!-- Subtle blue glowing corner indicator -->
  <path d="M 0 20 L 0 0 L 20 0" stroke="#3b82f6" stroke-width="3" fill="none" />
  <path d="M 800 100 L 800 120 L 780 120" stroke="#3b82f6" stroke-width="3" fill="none" />

  <!-- Left Icon Group (Folder & Sparkles) -->
  <g transform="translate(25, 30)">
    <!-- Icon Box -->
    <rect width="60" height="60" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" />
    
    <!-- Code/Portfolio Folder Wireframe -->
    <path d="M18 20 L24 20 L27 24 L42 24 A 1.5 1.5 0 0 1 43.5 25.5 L43.5 38 A 1.5 1.5 0 0 1 42 39.5 L18 39.5 A 1.5 1.5 0 0 1 16.5 38 L16.5 21.5 A 1.5 1.5 0 0 1 18 20 Z" fill="none" stroke="#3b82f6" stroke-width="2" />
    <path d="M22 28 L38 28 M22 32 L34 32" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Decorative sparkle dot -->
    <circle cx="45" cy="18" r="2.5" fill="#60a5fa" />
  </g>

  <!-- Text Details -->
  <text x="105" y="42" class="font-title">Interactive Portfolio Spotlight</text>
  <text x="105" y="64" class="font-desc">Explore my Data Science, Machine Learning, and IoT projects.</text>

  <!-- Technology Badges -->
  <!-- Badge 1: Data Science -->
  <g transform="translate(105, 78)">
    <rect width="90" height="20" rx="10" fill="rgba(59, 130, 246, 0.06)" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" />
    <text x="45" y="13" text-anchor="middle" class="font-badge">DATA SCIENCE</text>
  </g>

  <!-- Badge 2: Machine Learning -->
  <g transform="translate(202, 78)">
    <rect width="112" height="20" rx="10" fill="rgba(59, 130, 246, 0.06)" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" />
    <text x="56" y="13" text-anchor="middle" class="font-badge">MACHINE LEARNING</text>
  </g>

  <!-- Badge 3: IoT & Web -->
  <g transform="translate(321, 78)">
    <rect width="100" height="20" rx="10" fill="rgba(59, 130, 246, 0.06)" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" />
    <text x="50" y="13" text-anchor="middle" class="font-badge">IOT &amp; WEB DEV</text>
  </g>

  <!-- Right Call-to-Action Button -->
  <g transform="translate(620, 42)">
    <rect width="155" height="36" rx="6" fill="url(#btn-grad)" />
    <!-- Text -->
    <text x="77.5" y="22" text-anchor="middle" class="font-btn">LAUNCH PORTFOLIO</text>
  </g>
</svg>
