<svg width="100%" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Tech Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Outfit:wght@600;700;800&amp;display=swap');
    .font-title { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; font-size: 32px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .font-subtitle { font-family: 'Outfit', 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #3b82f6; letter-spacing: 3px; }
    .font-mono { font-family: 'Fira Code', 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #6b7280; font-weight: 500; }
    .font-mono-active { fill: #3b82f6; font-weight: 600; }
    .radar-line { stroke: #3b82f6; stroke-width: 1.5; stroke-opacity: 0.6; }
    .radar-dashed { stroke: #60a5fa; stroke-width: 1; stroke-opacity: 0.3; stroke-dasharray: 4 4; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="200" rx="12" fill="url(#bg-grad)" />
  <rect x="0.5" y="0.5" width="799" height="199" rx="11.5" stroke="#1e293b" stroke-opacity="0.6" />

  <!-- Grid overlay -->
  <rect width="800" height="200" rx="12" fill="url(#grid)" />

  <!-- Clean Accent Borders -->
  <path d="M 0 15 L 120 15 L 145 40 L 780 40" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 20 185 L 655 185 L 680 160 L 800 160" stroke="url(#accent-grad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Small corner ticks for tech aesthetic -->
  <path d="M 5 25 L 5 5 L 25 5" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 795 175 L 795 195 L 775 195" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Subtitle Info -->
  <text x="50" y="85" class="font-title">Hi, I'm Varizky Naldiba</text>
  <text x="50" y="115" class="font-subtitle">DATA SCIENTIST &amp; DATA ANALYST</text>

  <!-- Terminal Style Info Console -->
  <g transform="translate(50, 135)">
    <!-- Console Status Icons -->
    <circle cx="5" cy="15" r="3" fill="#10b981" />
    <text x="18" y="18" class="font-mono font-mono-active">SYS_STATUS: ACTIVE</text>
    
    <text x="160" y="18" class="font-mono">|</text>
    <text x="180" y="18" class="font-mono">FOCUS: DATA_SCIENCE // DATA_ANALYTICS</text>
    
    <text x="470" y="18" class="font-mono">|</text>
    <text x="490" y="18" class="font-mono">LOC: MLG, IDN</text>
  </g>

  <!-- Futuristic Radar/Telemetry Graphic on Right -->
  <g transform="translate(680, 100)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e293b" stroke-width="1" />
    
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="35" fill="none" class="radar-dashed" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="8" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="1.5" />

    <!-- Crosshair Lines -->
    <line x1="-50" y1="0" x2="50" y2="0" class="radar-line" stroke-dasharray="3 6" />
    <line x1="0" y1="-50" x2="0" y2="50" class="radar-line" stroke-dasharray="3 6" />
    
    <!-- Rotating indicator dots -->
    <circle cx="28" cy="-21" r="3" fill="#60a5fa" />
    <circle cx="-15" cy="15" r="2" fill="#3b82f6" stroke-opacity="0.7" />
    <circle cx="10" cy="20" r="1.5" fill="#3b82f6" stroke-opacity="0.5" />
  </g>
</svg>
